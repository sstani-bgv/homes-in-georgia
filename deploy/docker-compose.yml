# docker compose -f deploy/docker-compose.yml --env-file .env up -d --build
# Secrets come only from .env (see .env.example). Postgres is not exposed outside the compose network.
x-app: &app
  build: { context: .., dockerfile: deploy/Dockerfile }
  env_file: ../.env
  environment:
    SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY}
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-homes}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-homes}
  depends_on: { db: { condition: service_healthy } }
  restart: unless-stopped
  volumes: [media:/app/data, botdata:/app/bot/data, botraw:/app/bot/raw]

services:
  db:
    # pgvector (migration 0006). Debian/glibc image: the old postgres:16-alpine (musl) data sorts text differently, so
    # it gets a NEW volume and the data moves by pg_dump/pg_restore (docs/DEPLOY.md); the old `pg` volume stays as is.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-homes}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-homes}
    volumes: [pgvector:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"], interval: 5s, retries: 20 }
    restart: unless-stopped

  api:
    <<: *app
    ports: ["127.0.0.1:8000:8000"]   # put a TLS reverse proxy (Caddy/Traefik/Dokploy) in front
    healthcheck: { test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)"], interval: 30s }

  worker:
    <<: *app
    command: ["sh", "-c", "cd backend && python -m app.worker"]
    depends_on: { api: { condition: service_started } }

  bot:
    <<: *app
    command: ["python", "-m", "bot.run"]
    depends_on: { api: { condition: service_started } }

  refresh:
    <<: *app
    command: ["sh", "-c", "cd bot && ./refresh_loop.sh"]
    depends_on: { api: { condition: service_started } }

  # Operator userbot (Telethon, the operator's own account; backend/app/telegram/userbot.py): sends viewing slots to
  # clients. Set OPERATOR_USERBOT_SESSION, API_ID, API_HASH and USERBOT_URL=http://userbot:8091 in .env, then uncomment
  # (docs/DEPLOY.md «Один бот и userbot оператора»). Never publish its port.
  # userbot:
  #   <<: *app
  #   command: ["sh", "-c", "cd backend && python -m app.telegram.userbot"]
  #   depends_on: { api: { condition: service_started } }

  # Optional S3-compatible storage for local tests of MEDIA_STORAGE=s3 (production uses R2 / Hetzner): uncomment and set
  # MEDIA_STORAGE=s3 S3_ENDPOINT=http://minio:9000 S3_BUCKET=homes S3_ACCESS_KEY=minio S3_SECRET_KEY=<secret> in .env.
  # minio:
  #   image: bitnamilegacy/minio:latest   # minio/minio is no longer published on Docker Hub
  #   environment: { MINIO_ROOT_USER: minio, MINIO_ROOT_PASSWORD: "${S3_SECRET_KEY}", MINIO_DEFAULT_BUCKETS: homes }
  #   ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
  #   volumes: [minio:/bitnami/minio/data]   # + `minio: {}` under volumes
  #   restart: unless-stopped

volumes: { pg: {}, pgvector: {}, media: {}, botdata: {}, botraw: {} }   # pg: the old alpine data, kept for rollback
